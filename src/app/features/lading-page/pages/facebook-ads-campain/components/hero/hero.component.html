<section
  class="min-h-screen w-full px-6 pb-24 pt-28 flex items-start justify-center bg-[linear-gradient(rgba(99,102,241,0.12)_1px,transparent_1px),linear-gradient(90deg,rgba(99,102,241,0.12)_1px,transparent_1px)] bg-[size:60px_60px]"
>
  <div class="mx-auto max-w-7xl flex flex-col items-center text-center">
    <span
      class="inline-flex items-center gap-2 bg-rose-500/90 text-white/90 text-[11px] md:text-sm font-extrabold px-4 py-2 rounded-2xl shadow shadow-red-900/10"
    >
      <span class="w-2 h-2 rounded-full bg-white/90"></span>
      Facebook Ads VCC
    </span>

    <h1 class="mt-6 text-4xl font-bold leading-tight text-slate-700 md:text-7xl">
      Virtual Cards for <br />
      <span
        class="bg-gradient-to-r from-red-500 via-rose-500 to-pink-500 bg-clip-text text-transparent"
      >
        Facebook Ads
      </span>
    </h1>

    <p class="mx-auto mt-6 max-w-2xl text-lg md:text-xl leading-8 text-slate-500/70 font-semibold">
      Run successful Facebook ad campaigns with a Finup VCC. Get a virtual card for Facebook ads &
      manage your budget easily.
    </p>

    <!-- BUTTON -->
    <button
      (click)="navigateService.navigateToUserAuth()"
      class="mt-8 group hero-item flex items-center gap-5 md:gap-8 rounded-full bg-gradient-to-r from-red-500 via-rose-500 to-pink-500 hover:from-red-600 hover:via-rose-600 hover:to-pink-600 text-white font-bold px-6 md:px-7 py-2.5 shadow-lg shadow-red-900/20 hover:shadow-red-900/30 transition-all duration-300 hover:-translate-y-0.5 active:translate-y-0"
    >
      <span>
        <span>{{ 'hero.primary_cta' | translate }}</span></span
      >

      <span
        class="w-10 h-10 md:w-11 md:h-11 rounded-full bg-red-600 group-hover:bg-red-400 flex items-center justify-center transition-all duration-300"
      >
        <i class="fa-solid fa-arrow-right text-base md:text-lg"></i>
      </span>
    </button>

    <!-- RED LIGHT MOCKUP UI -->
    <div class="relative mt-1 w-full max-w-4xl px-4 pt-12 md:px-10 md:pt-16">
      <div class="absolute inset-x-0 bottom-0 h-56 pointer-events-none">
        <div class="absolute left-6 bottom-0 h-32 w-64 rounded-full bg-red-400/80 blur-3xl"></div>

        <div class="absolute right-6 bottom-0 h-32 w-64 rounded-full bg-red-400/80 blur-3xl"></div>

        <div
          class="absolute left-1/2 bottom-0 h-40 w-[520px] -translate-x-1/2 rounded-full bg-rose-200/25 blur-3xl"
        ></div>
      </div>

      <div class="relative mx-auto flex h-[430px] max-w-3xl items-end justify-center md:h-[470px]">
        <!-- top small icon -->
        <div
          class="absolute left-[27%] top-0 z-20 hidden h-14 w-14 items-center justify-center rounded-full border border-rose-100 bg-white text-rose-500 shadow-xl shadow-rose-200/70 md:flex"
        >
          <i class="fa-regular fa-credit-card text-xl"></i>
        </div>

        <!-- decorative circles -->
        <div
          class="absolute left-1/2 top-10 h-[360px] w-[360px] -translate-x-1/2 rounded-full border border-rose-200/70"
        ></div>

        <div
          class="absolute left-1/2 top-0 h-[470px] w-[470px] -translate-x-1/2 rounded-full border border-red-100/80"
        ></div>

        <!-- right back card -->
        <div
          class="absolute right-4 top-8 z-10 hidden h-36 w-64 overflow-hidden rounded-xl bg-gradient-to-br from-red-500 via-rose-500 to-pink-500 p-5 text-left shadow-2xl shadow-rose-300/50 md:block"
        >
          <div class="text-2xl font-black text-white">FINUP</div>

          <div class="absolute inset-x-0 bottom-0 h-16 bg-red-950/70"></div>

          <div
            class="absolute bottom-6 right-6 text-2xl font-black italic tracking-wide text-white"
          >
            VISA
          </div>

          <div class="absolute right-8 top-6 h-20 w-20 rounded-full bg-white/20 blur-2xl"></div>
        </div>

        <!-- left front card -->
        <div
          class="absolute left-0 top-28 z-30 h-36 w-64 rounded-xl bg-gradient-to-br from-red-400 via-rose-300 to-white p-5 text-left shadow-2xl shadow-rose-300/60 md:left-2"
        >
          <div class="text-5xl font-black leading-none text-white">F.</div>

          <div class="absolute bottom-5 left-5 flex items-center gap-2">
            <span class="text-sm font-bold tracking-[0.25em] text-slate-700">••••</span>
            <span class="text-sm font-bold tracking-widest text-slate-700">7788</span>
          </div>

          <div class="absolute bottom-5 right-5 flex">
            <span class="h-7 w-7 rounded-full bg-red-500"></span>
            <span class="-ml-3 h-7 w-7 rounded-full bg-orange-400/90"></span>
          </div>
        </div>

        <!-- phone -->
        <div
          class="relative z-20 h-[360px] w-[250px] rounded-[2.5rem] border-[10px] border-slate-900 bg-white shadow-2xl shadow-rose-300/60 md:h-[410px] md:w-[285px]"
        >
          <div
            class="absolute left-1/2 top-2 h-7 w-24 -translate-x-1/2 rounded-full bg-black"
          ></div>

          <div class="flex items-center justify-between px-6 pt-4 text-[11px] font-bold text-black">
            <span>9:41</span>

            <div class="flex items-center gap-1">
              <i class="fa-solid fa-signal text-[10px]"></i>
              <i class="fa-solid fa-wifi text-[10px]"></i>
              <span class="rounded bg-green-100 px-1 text-[9px] font-black text-green-600">
                78
              </span>
            </div>
          </div>

          <div class="flex h-full flex-col items-center justify-center pb-10">
            <div
              class="flex h-16 w-16 items-center justify-center rounded-full bg-blue-600 text-4xl font-black text-white shadow-lg shadow-blue-900/20"
            >
              f
            </div>

            <div class="mt-4 text-3xl font-black tracking-tight text-blue-600">
              facebook<span class="font-semibold text-slate-400"> Ads</span>
            </div>

            <div class="mt-6 rounded-full bg-rose-50 px-4 py-2 text-xs font-bold text-rose-500">
              Virtual card ready
            </div>
          </div>
        </div>

        <!-- facebook ads tags -->
        <div class="absolute right-1 top-52 z-30 hidden flex-col gap-3 md:flex">
          <div
            class="flex rotate-3 items-center gap-3 rounded-full border border-rose-100 bg-white/90 px-4 py-3 text-sm font-bold text-slate-700 shadow-xl shadow-rose-200/60 backdrop-blur"
          >
            <span
              class="flex h-7 w-7 items-center justify-center rounded-full bg-blue-600 text-base font-black text-white"
            >
              f
            </span>
            Facebook Ads
          </div>

          <div
            class="flex rotate-12 items-center gap-3 rounded-full border border-rose-100 bg-white/80 px-4 py-3 text-sm font-bold text-slate-500 shadow-xl shadow-rose-200/50 backdrop-blur"
          >
            <span
              class="flex h-7 w-7 items-center justify-center rounded-full bg-blue-600 text-base font-black text-white"
            >
              f
            </span>
            Facebook Ads
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
