<div
  class="relative inline-flex items-center"
  (mouseenter)="isLangOpen = true"
  (mouseleave)="isLangOpen = false"
>
  <!-- Trigger -->
  <button
    type="button"
    class="inline-flex h-9 w-[115px] items-center justify-between rounded-full border border-red-300/60 bg-rose-400 px-3 text-sm font-bold text-white shadow-sm outline-none transition hover:border-red-400 hover:bg-rose-500 focus:border-red-500 focus:bg-rose-500 focus:ring-4 focus:ring-red-100"
    [class.bg-rose-500]="isLangOpen"
  >
    <span class="truncate">
      {{ getCurrentLanguageLabel() }}
    </span>

    <svg
      class="h-4 w-4 shrink-0 transition-transform duration-200"
      [class.rotate-180]="isLangOpen"
      viewBox="0 0 20 20"
      fill="currentColor"
      aria-hidden="true"
    >
      <path
        fill-rule="evenodd"
        d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
        clip-rule="evenodd"
      />
    </svg>
  </button>

  <!-- Dropdown hover area -->
  <div *ngIf="isLangOpen" class="absolute right-0 top-full z-50 w-36 pt-2">
    <div
      class="overflow-hidden rounded-xl border border-rose-100 bg-white py-2 shadow-xl shadow-rose-100/80"
    >
      <button
        *ngFor="let lang of languageService.languages"
        type="button"
        class="flex w-full items-center gap-2 px-4 py-2.5 text-left text-sm font-semibold text-gray-700 transition hover:bg-rose-50 hover:text-rose-500"
        [class.bg-rose-50]="languageService.currentLang() === lang.code"
        [class.text-rose-500]="languageService.currentLang() === lang.code"
        (click)="changeLanguage(lang.code)"
      >
        <span>{{ lang.flag }}</span>
        <span>{{ lang.nativeLabel }}</span>
      </button>
    </div>
  </div>
</div>
